<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>react-qr-master · playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #07070c;
        --bg-soft: #0d0d15;
        --bg-card: rgba(255, 255, 255, 0.04);
        --bg-card-hover: rgba(255, 255, 255, 0.07);
        --card-solid: #13131c;
        --border: rgba(255, 255, 255, 0.08);
        --border-bright: rgba(255, 255, 255, 0.16);
        --text: #f0f0f5;
        --text-primary: #f0f0f5;
        --text-muted: #a0a0b0;
        --text-subtle: #6a6a7a;
        --primary: #a855f7;
        --primary-dark: #7c3aed;
        --primary-glow: rgba(168, 85, 247, 0.4);
        --accent: #22d3ee;
        --accent-glow: rgba(34, 211, 238, 0.35);
        --danger: #f87171;
        --success: #34d399;
        --warning: #fbbf24;
        /* Footer / rgb-channel helpers (used as `rgb(var(--x) / a)`) */
        --surface-rgb: 255 255 255;
        --surface-strong-rgb: 13 13 21;
        --border-rgb: 255 255 255;
        /* App chrome surfaces */
        --sidebar-bg: rgba(13, 13, 21, 0.55);
        --sidebar-bg-solid: rgba(13, 13, 21, 0.98);
        --bar-bg: rgba(13, 13, 21, 0.9);
        --hero-text-grad: linear-gradient(135deg, #ffffff 0%, #e0d9f8 40%, #a5f3fc 100%);
        --brand-text-grad: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
        /* Code blocks stay dark in both themes for readability */
        --code-bg: rgba(0, 0, 0, 0.5);
        --code-text: #e8e8f0;
        --code-border: rgba(255, 255, 255, 0.1);
      }

      :root[data-theme='light'] {
        color-scheme: light;
        --bg: #f6f7fb;
        --bg-soft: #eef1f8;
        --bg-card: rgba(15, 23, 42, 0.035);
        --bg-card-hover: rgba(15, 23, 42, 0.07);
        --card-solid: #ffffff;
        --border: rgba(15, 23, 42, 0.1);
        --border-bright: rgba(15, 23, 42, 0.2);
        --text: #0f172a;
        --text-primary: #0f172a;
        --text-muted: #475569;
        --text-subtle: #64748b;
        --primary: #7c3aed;
        --primary-dark: #6d28d9;
        --primary-glow: rgba(124, 58, 237, 0.3);
        --accent: #0891b2;
        --accent-glow: rgba(8, 145, 178, 0.3);
        --danger: #dc2626;
        --success: #059669;
        --warning: #d97706;
        --surface-rgb: 15 23 42;
        --surface-strong-rgb: 255 255 255;
        --border-rgb: 15 23 42;
        --sidebar-bg: rgba(255, 255, 255, 0.72);
        --sidebar-bg-solid: rgba(255, 255, 255, 0.98);
        --bar-bg: rgba(255, 255, 255, 0.85);
        --hero-text-grad: linear-gradient(135deg, #0f172a 0%, #5b21b6 45%, #0891b2 100%);
        --brand-text-grad: linear-gradient(135deg, #1e293b 0%, #7c3aed 100%);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        font-feature-settings: 'ss01', 'cv11';
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background 0.3s ease, color 0.3s ease;
      }
      code, pre {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
      }
      input, button, select, textarea {
        font-family: inherit;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.16); }
      :root[data-theme='light'] ::-webkit-scrollbar-thumb {
        background: rgba(15, 23, 42, 0.15);
      }
      :root[data-theme='light'] ::-webkit-scrollbar-thumb:hover {
        background: rgba(15, 23, 42, 0.28);
      }

      /* Card lift-on-hover */
      .qrm-card {
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      }
      .qrm-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(0,0,0,0.35), 0 24px 48px -16px rgba(168,85,247,0.25) !important;
        border-color: rgba(168,85,247,0.25) !important;
      }

      .qrm-btn-primary:hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }
      .qrm-btn-secondary:hover {
        background: rgba(255,255,255,0.08) !important;
        border-color: rgba(255,255,255,0.18) !important;
      }
      .qrm-bg-blobs {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .qrm-bg-blobs::before,
      .qrm-bg-blobs::after {
        content: '';
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.32;
      }
      .qrm-bg-blobs::before {
        background: #7c3aed;
        top: -200px;
        left: -200px;
      }
      .qrm-bg-blobs::after {
        background: #22d3ee;
        bottom: -200px;
        right: -200px;
        opacity: 0.18;
      }
      :root[data-theme='light'] .qrm-bg-blobs::before { opacity: 0.12; }
      :root[data-theme='light'] .qrm-bg-blobs::after { opacity: 0.1; }
    </style>
  </head>
  <body>
    <div class="qrm-bg-blobs"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
