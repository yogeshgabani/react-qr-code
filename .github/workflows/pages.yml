# Deploys a mirror of the playground to GitHub Pages at
# https://yogeshgabani.github.io/react-qr-code/ (the main live demo is
# https://react-next-qrcode.netlify.app/, see netlify.toml).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run playground:build
        env:
          PLAYGROUND_BASE: /react-qr-code/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist
      - id: deployment
        uses: actions/deploy-pages@v4
