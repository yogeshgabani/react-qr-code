# Deploys the playground (live demo) to Netlify:
# https://react-next-qrcode.netlify.app/
# `vite build playground` writes to playground/dist, not the root dist/
# (that one holds the npm package build).
[build]
  command = "npm run playground:build"
  publish = "playground/dist"

[build.environment]
  # Vite 8 needs Node 20.19+; match the GitHub Pages workflow.
  NODE_VERSION = "22"
